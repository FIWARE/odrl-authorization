{{- if and .Values.enabled .Values.apisix.enabled }}
{{- $traditionalMode := and (eq .Values.apisix.apisix.deployment.mode "traditional") (eq .Values.apisix.apisix.deployment.role_traditional.config_provider "etcd") }}
{{- $standaloneTraditional := and (eq .Values.apisix.apisix.deployment.mode "standalone") (eq .Values.apisix.apisix.deployment.role "traditional") }}
{{- $decoupledControlPlane := and (eq .Values.apisix.apisix.deployment.mode "decoupled") (eq .Values.apisix.apisix.deployment.role "control_plane") }}
{{ $ingressConfig := (index .Values.apisix "ingress-controller") }}
{{/* If ingress controller is enabled it will use custom resources */}}
{{/* It requires admin endpoint and it is only available if one of these modes is enabled
  - mode: traditional, role_traditional: etcd
  - mode: standalone, role: traditional
  - mode: decoupled, role: control_plane
 */}}
{{- if and (not $ingressConfig.enabled) (or $traditionalMode $standaloneTraditional $decoupledControlPlane) }}
{{- $adminUrl := printf "http://%s:%s" (include "odrl-auth.apisix-admin-service" .) (toString (default 9180 .Values.apisix.apisix.admin.servicePort)) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: apisix-routes-job
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "odrl-auth.labels" . | nindent 4 }}
    {{- with .Values.apisix.routeJob.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- toYaml .Values.apisix.routeJob.annotations | nindent 4 }}
    {{- with .Values.apisix.routeJob.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ttlSecondsAfterFinished: {{ .Values.apisix.routeJob.ttlSecondsAfterFinished }}
  template:
    spec:
      initContainers:
        - name: wait-for-apisix
          image: {{ .Values.apisix.routeJob.image.repository }}:{{ .Values.apisix.routeJob.image.tag }}
          imagePullPolicy: {{ .Values.apisix.routeJob.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              until curl -so /dev/null -w "%{http_code}" {{ $adminUrl }}/apisix/admin/routes | grep -qE "^(200|401|403)"; do
                echo "Waiting for APISIX admin API..."
                sleep 5
              done
      containers:
        - name: register-routes
          image: {{ .Values.apisix.routeJob.image.repository }}:{{ .Values.apisix.routeJob.image.tag }}
          imagePullPolicy: {{ .Values.apisix.routeJob.image.pullPolicy }}
          command: [ "/bin/sh", "-c", "/bin/create-routes.sh" ]
          env:
            {{- /* APISIX chart v3 ships no default admin key: a user-provided Secret
                   (secretName) or inline key wins, otherwise fall back to the Secret the
                   apisix chart generates (<apisix fullname>-admin-credentials, key "admin"),
                   so the job uses the same key without anyone pinning one. */}}
            {{- $creds := .Values.apisix.apisix.admin.credentials }}
            - name: API_KEY
              {{- if $creds.secretName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $creds.secretName }}
                  key: {{ $creds.secretAdminKey | default "admin" }}
              {{- else if $creds.admin }}
              value: {{ $creds.admin | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "apisix.admin.credentials.generatedSecretName" (index .Subcharts "apisix") }}
                  key: admin
              {{- end }}
          volumeMounts:
            - name: apisix-routes
              mountPath: /bin/create-routes.sh
              subPath: create-routes.sh
      volumes:
        - name: apisix-routes
          configMap:
            name: apisix-routes-script
            defaultMode: 0755
      restartPolicy: Never
  backoffLimit: 10
{{- end }}
{{- end }}