name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string

jobs:
  generate-version:
    name: "Generate version"
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.out.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          java-package: jdk

      - id: pr
        uses: actions-ecosystem/action-get-merged-pull-request@v1.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Match semver label via bash
        id: match-label-bash
        run: |
          LABELS=$(cat <<-END
          ${{ steps.pr.outputs.labels }}
          END
          )
          IFS='\n' read -ra LABEL <<< "$LABELS"
          for i in "${LABEL[@]}"; do
              echo $i
              case $i in
                  # Will just use the first occurence
                  'major'|'minor'|'patch')
                      echo "RELEASE_LABEL=$i" >> $GITHUB_OUTPUT
                      break
              esac
          done

      - uses: zwaldowski/semver-release-action@v4
        with:
          dry_run: true
          bump: minor
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version output
        id: out
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

  # Publishes the charts, failing when a changed chart has no new version, see
  # https://github.com/FIWARE/github-workflows
  chart-release:
    uses: FIWARE/github-workflows/.github/workflows/chart-release.yml@v1
    permissions:
      contents: write

  git-release:
    name: "Create Git Release"
    needs: ["generate-version", "chart-release"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install helm-docs
        run: |
          wget -O /tmp/helm-docs.tar.gz https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          tar -xf /tmp/helm-docs.tar.gz  -C /tmp
      - name: Add chart properties to README.md
        continue-on-error: true
        run: |
          export PATH=$PATH:/tmp
          .github/scripts/add-to-readme.sh
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git status
          git diff --quiet README.md || (git add README.md && git commit -m "Update chart properties")
      - name: Generate Table of contents
        uses: technote-space/toc-generator@v4
        with:
          TARGET_PATHS: "./README.md"
          COMMIT_MESSAGE: "Update ToC"
