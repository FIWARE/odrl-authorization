name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3)"
        required: true
        type: string

# releases one after the other, each reading the tags left by the previous one
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  # The version from the semver label of the merged pull request, X.Y.Z. See
  # https://github.com/FIWARE/github-workflows
  generate-version:
    if: github.event_name != 'workflow_dispatch'
    uses: FIWARE/github-workflows/.github/workflows/semver-version.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      tag-prefix: ""

  # Publishes the charts, failing when a changed chart has no new version, see
  # https://github.com/FIWARE/github-workflows
  chart-release:
    uses: FIWARE/github-workflows/.github/workflows/chart-release.yml@v1
    permissions:
      contents: write

  # Independent of the version, so that it also runs for a push that no labelled pull request carries
  docs:
    name: "Update the documentation"
    needs: ["chart-release"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install helm-docs
        run: |
          wget -O /tmp/helm-docs.tar.gz https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz
          tar -xf /tmp/helm-docs.tar.gz  -C /tmp
      - name: Add chart properties to README.md
        continue-on-error: true
        run: |
          export PATH=$PATH:/tmp
          .github/scripts/add-to-readme.sh
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git status
          git diff --quiet README.md || (git add README.md && git commit -m "Update chart properties")
      - name: Generate Table of contents
        uses: technote-space/toc-generator@v4
        with:
          TARGET_PATHS: "./README.md"
          COMMIT_MESSAGE: "Update ToC"

  git-release:
    needs: ["generate-version", "chart-release"]
    if: always() && needs.chart-release.result == 'success' && (needs.generate-version.result == 'success' || github.event_name == 'workflow_dispatch')
    uses: FIWARE/github-workflows/.github/workflows/github-release.yml@v1
    permissions:
      contents: write
    with:
      version: ${{ inputs.version || needs.generate-version.outputs.version }}
